<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRTI Multi-Exchange TWAP Drift Dashboard</title>
  <style>
    :root {
      --bg-dark: #0e1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --color-safe: #238636;
      --color-warn: #d29922;
      --color-exit: #da3633;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Dynamic Alert Banner */
    #alertBanner {
      width: 100%;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .status-safe { background-color: var(--color-safe); color: #ffffff; }
    .status-warn { background-color: var(--color-warn); color: #000000; animation: pulse-warn 1s infinite alternate; }
    .status-exit { background-color: var(--color-exit); color: #ffffff; animation: pulse-exit 0.4s infinite alternate; }
    .status-stale { background-color: #8b949e; color: #000000; }

    @keyframes pulse-warn { from { opacity: 0.85; } to { opacity: 1; transform: scale(1.005); } }
    @keyframes pulse-exit { from { opacity: 0.8; } to { opacity: 1; transform: scale(1.01); } }

    /* Controls Header */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 12px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    input, select, button {
      background: #0d1117;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      outline: none;
    }

    button {
      background: #238636;
      color: #ffffff;
      cursor: pointer;
      border: none;
      transition: background 0.2s ease-in-out;
    }

    button.active {
      background: #388bfd;
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .metric-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .metric-value {
      font-size: 1.8rem;
      font-weight: 700;
      font-family: monospace;
    }

    /* Progress Bar */
    .progress-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #21262d;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #58a6ff;
      transition: width 0.3s linear;
    }

    .connection-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Top Alert Banner -->
  <div id="alertBanner" class="status-safe">
    INITIALIZING FEEDS...
  </div>

  <!-- User Configuration Controls -->
  <div class="controls-grid">
    <div class="control-group">
      <label for="targetPrice">Strike Target Price ($)</label>
      <input type="number" id="targetPrice" value="64889.12" step="0.01">
    </div>

    <div class="control-group">
      <label for="positionDir">Your Contract Side</label>
      <select id="positionDir">
        <option value="OVER">YES / OVER Target</option>
        <option value="UNDER">NO / UNDER Target</option>
      </select>
    </div>

    <div class="control-group">
      <label for="audioToggle">Audio Alerts</label>
      <select id="audioToggle">
        <option value="ON">Enabled (Alarms Active)</option>
        <option value="OFF">Muted</option>
      </select>
    </div>

    <div class="control-group">
      <label>15-Min Candle Clock</label>
      <div id="timerDisplay" class="metric-value" style="font-size: 1.3rem; color: #58a6ff;">--:--</div>
    </div>

    <div class="control-group" style="grid-column: 1 / -1;">
      <button id="keepAliveBtn" onclick="toggleKeepAlive()">🔊 Arm Background Audio Radar (For Robinhood Multitasking)</button>
    </div>
  </div>

  <!-- KPI Metrics Grid -->
  <div class="metrics-grid">
    <div class="metric-card">
      <span class="metric-title">4-Exch BRTI Spot (VWM)</span>
      <span id="liveSpot" class="metric-value">$0.00</span>
    </div>

    <div class="metric-card">
      <span class="metric-title">Coinbase vs Index Gap</span>
      <span id="cbDivergence" class="metric-value" style="color: #a5d6ff;">$0.00</span>
    </div>

    <div class="metric-card">
      <span class="metric-title">Current Locked TWAP</span>
      <span id="currentTwap" class="metric-value">$0.00</span>
    </div>

    <div class="metric-card">
      <span class="metric-title">Req. Reversal Price (P_req)</span>
      <span id="pReqDisplay" class="metric-value" style="color: #f78166;">$0.00</span>
    </div>

    <div class="metric-card">
      <span class="metric-title">Safety Cushion / Gap</span>
      <span id="cushionGap" class="metric-value">$0.00</span>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-container">
    <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted);">
      <span>Candle Elapsed: <strong id="elapsedSecs">0</strong>s</span>
      <span>Remaining: <strong id="remainingSecs">900</strong>s</span>
    </div>
    <div class="progress-bar-bg">
      <div id="progressFill" class="progress-bar-fill"></div>
    </div>
  </div>

  <div class="connection-status" id="wsStatus">
    Loading historical candle data...
  </div>

  <script>
    // --- Global State ---
    let candleTicks = [];
    let liveTradeBuffer = [];
    let liveSpotPrice = 0;
    let coinbasePrice = 0;
    let lastElapsedSecs = -1;
    let audioCtx = null;
    let keepAliveOsc = null;
    let lastAlertTime = 0;
    let lastTradeTimestamp = 0;
    let activeExchanges = new Set();
    let isArmed = false;
    let pendingReconnect = false;
    let lastTickTs = Date.now();

    const FEED_SOURCES = ['Coinbase', 'Kraken', 'Bitstamp', 'Gemini'];
    const FEED_STALE_MS = 8000;
    const FEED_TIMEOUT_MS = 10000;
    let feedSockets = {};

    // --- Native App Bridge Detection ---
    function isNativeApp() {
      return !!(
        (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ||
        (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TonePlayer)
      );
    }

    function nativeBridge() {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TonePlayer) {
        return window.Capacitor.Plugins.TonePlayer;
      }
      return null;
    }

    function playNativeTone(name) {
      const tp = nativeBridge();
      if (!tp) return false;
      try {
        Promise.resolve(tp.playTone({ name })).catch(() => {});
        return true;
      } catch (err) {
        return false;
      }
    }

    // --- Persisted Preferences (strike, side, audio) ---
    function loadPrefs() {
      try {
        const raw = localStorage.getItem('btcTwapPrefs');
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p.targetPrice) document.getElementById('targetPrice').value = p.targetPrice;
        if (p.positionDir) document.getElementById('positionDir').value = p.positionDir;
        if (p.audioToggle) document.getElementById('audioToggle').value = p.audioToggle;
      } catch (err) {}
    }

    function savePrefs() {
      try {
        localStorage.setItem('btcTwapPrefs', JSON.stringify({
          targetPrice: document.getElementById('targetPrice').value,
          positionDir: document.getElementById('positionDir').value,
          audioToggle: document.getElementById('audioToggle').value
        }));
      } catch (err) {}
    }

    ['targetPrice', 'positionDir', 'audioToggle'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', savePrefs);
    });
    loadPrefs();

    // --- iOS/mobile: unlock AudioContext on first user gesture ---
    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function initAudioUnlock() {
      const unlock = () => {
        unlockAudio();
        window.removeEventListener('pointerdown', unlock);
        window.removeEventListener('touchstart', unlock);
        window.removeEventListener('keydown', unlock);
        window.removeEventListener('mousedown', unlock);
      };
      window.addEventListener('pointerdown', unlock);
      window.addEventListener('touchstart', unlock);
      window.addEventListener('keydown', unlock);
      window.addEventListener('mousedown', unlock);
    }
    initAudioUnlock();

    // --- Background Keep-Alive Audio Engine ---
    function toggleKeepAlive() {
      const btn = document.getElementById('keepAliveBtn');

      if (!isArmed) {
        if (isNativeApp()) {
          // Native app: play an imperceptible silent loop in the app's background audio session
          if (!playNativeTone('keepalive')) return;
        } else {
          unlockAudio();
          // Create imperceptible continuous background tone (15Hz sub-audible) to keep iOS WebSockets alive in background
          keepAliveOsc = audioCtx.createOscillator();
          const keepAliveGain = audioCtx.createGain();
          keepAliveOsc.type = 'sine';
          keepAliveOsc.frequency.setValueAtTime(15, audioCtx.currentTime); // 15 Hz is below human hearing
          keepAliveGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
          keepAliveOsc.connect(keepAliveGain);
          keepAliveGain.connect(audioCtx.destination);
          keepAliveOsc.start();
        }

        isArmed = true;
        btn.className = "active";
        btn.innerText = "⚡ AUDIO RADAR ACTIVE (Safe to open Robinhood now!)";
      } else {
        if (isNativeApp()) {
          playNativeTone('stop');
        } else {
          if (keepAliveOsc) keepAliveOsc.stop();
        }
        isArmed = false;
        btn.className = "";
        btn.innerText = "🔊 Arm Background Audio Radar (For Robinhood Multitasking)";
      }
    }

    // --- Alert Sounds: native in-app, Web Audio fallback ---
    function playSound(type) {
      if (document.getElementById('audioToggle').value !== 'ON') return;
      const now = Date.now();
      if (now - lastAlertTime < 1000) return;
      lastAlertTime = now;

      if (type === 'WARN' || type === 'EXIT') {
        if (playNativeTone(type.toLowerCase())) return;
      }

      unlockAudio();

      // Soft sine chime with smooth fade in/out (gentle, not alarming)
      function playGentleTone(freq, duration, volume, delay) {
        const t0 = audioCtx.currentTime + (delay || 0);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(volume, t0 + 0.05);
        gain.gain.setValueAtTime(volume, t0 + duration - 0.1);
        gain.gain.linearRampToValueAtTime(0, t0 + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + duration);
      }

      if (type === 'WARN') {
        playGentleTone(660, 0.4, 0.2); // one soft chime (E5)
      } else if (type === 'EXIT') {
        playGentleTone(587.33, 0.28, 0.16, 0); // gentle two-note fall (D5 -> A4)
        playGentleTone(440, 0.3, 0.14, 0.28);
      }
    }

    // --- Fetch Real Kraken Historical 1-Min Candles ---
    async function fetchHistoricalCandles() {
      const statusEl = document.getElementById('wsStatus');
      try {
        const now = new Date();
        const mins = now.getMinutes();
        const windowStartMin = Math.floor(mins / 15) * 15;
        const windowStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), windowStartMin, 0);
        const windowStartUnix = Math.floor(windowStart.getTime() / 1000);
        const targetElapsedSecs = Math.floor((now.getTime() - windowStart.getTime()) / 1000);

        if (targetElapsedSecs <= 5) return;

        statusEl.innerText = "Backfilling real historical candles...";
        const response = await fetch('https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=1');
        const json = await response.json();

        if (json.result && json.result.XXBTZUSD) {
          const candles = json.result.XXBTZUSD;
          const currentCandles = candles.filter(c => c[0] >= windowStartUnix).sort((a,b) => a[0] - b[0]);

          candleTicks = [];
          currentCandles.forEach(c => {
            const avgPrice = (parseFloat(c[1]) + parseFloat(c[2]) + parseFloat(c[3]) + parseFloat(c[4])) / 4;
            for (let s = 0; s < 60; s++) {
              if (candleTicks.length < targetElapsedSecs) {
                candleTicks.push(avgPrice);
              }
            }
          });
          statusEl.innerText = `Backfilled ${candleTicks.length}s of exchange history. Connecting feeds...`;
        }
      } catch (err) {
        statusEl.innerText = "Using live spot baseline...";
      }
    }

    // --- 4-Exchange WebSocket Aggregator (per-feed connection manager) ---
    function initWebSockets() {
      activeExchanges.clear();
      FEED_SOURCES.forEach(source => connectFeed(source));
    }

    function addTrade(source, price, volume) {
      if (!price || isNaN(price) || !volume || isNaN(volume)) return;
      const now = Date.now();
      lastTradeTimestamp = now;
      if (feedSockets[source]) feedSockets[source].lastTradeTs = now;
      activeExchanges.add(source);
      if (source === 'Coinbase') coinbasePrice = price;

      liveTradeBuffer.push({ source, price, volume, ts: now });

      while (liveTradeBuffer.length > 0 && liveTradeBuffer[0].ts < now - 5000) {
        liveTradeBuffer.shift();
      }
      computeVWM();
      const statusEl = document.getElementById('wsStatus');
      statusEl.innerText = `Connected: ${activeExchanges.size}/4 Feeds Active (${Array.from(activeExchanges).join(', ')})`;
      statusEl.style.color = "#3fb950";
    }

    function subscribeMessage(source) {
      if (source === 'Coinbase') return JSON.stringify({ type: "subscribe", product_ids: ["BTC-USD"], channels: ["ticker"] });
      if (source === 'Kraken') return JSON.stringify({ event: "subscribe", pair: ["XBT/USD"], subscription: { name: "trade" } });
      if (source === 'Bitstamp') return JSON.stringify({ event: "bts:subscribe", data: { channel: "live_trades_btcusd" } });
      return null; // Gemini needs no subscribe message
    }

    function parseTrade(source, data) {
      try {
        const msg = JSON.parse(data);
        if (source === 'Coinbase') {
          if (msg.type === "ticker" && msg.price) addTrade('Coinbase', parseFloat(msg.price), parseFloat(msg.last_size || 1));
        } else if (source === 'Kraken') {
          if (Array.isArray(msg) && msg[1]) {
            msg[1].forEach(t => addTrade('Kraken', parseFloat(t[0]), parseFloat(t[1])));
          }
        } else if (source === 'Bitstamp') {
          if (msg.event === "trade" && msg.data) addTrade('Bitstamp', parseFloat(msg.data.price), parseFloat(msg.data.amount));
        } else if (source === 'Gemini') {
          if (msg.events) {
            msg.events.filter(ev => ev.type === "trade").forEach(ev => addTrade('Gemini', parseFloat(ev.price), parseFloat(ev.amount)));
          }
        }
      } catch(err){}
    }

    function connectFeed(source) {
      const existing = feedSockets[source];
      if (existing && existing.ws && existing.ws.readyState === WebSocket.OPEN) return;
      if (existing && existing.connectTimer) {
        clearTimeout(existing.connectTimer);
        existing.connectTimer = null;
      }

      const urls = {
        Coinbase: 'wss://ws-feed.exchange.coinbase.com',
        Kraken: 'wss://ws.kraken.com',
        Bitstamp: 'wss://ws.bitstamp.net',
        Gemini: 'wss://api.gemini.com/v1/marketdata/BTCUSD'
      };

      const state = { ws: null, lastTradeTs: 0, connected: false, connectTimer: null, reconnectTimer: null, tornDown: false };
      feedSockets[source] = state;

      let ws;
      try {
        ws = new WebSocket(urls[source]);
      } catch(err) {
        scheduleReconnect(source);
        return;
      }
      state.ws = ws;

      ws.onopen = () => {
        state.connected = true;
        const sub = subscribeMessage(source);
        if (sub) ws.send(sub);
      };

      ws.onmessage = (e) => {
        state.lastTradeTs = Date.now();
        parseTrade(source, e.data);
      };

      ws.onclose = () => {
        state.connected = false;
        activeExchanges.delete(source);
        scheduleReconnect(source);
      };

      ws.onerror = () => {
        try { ws.close(); } catch(e){}
      };

      // Connect-timeout guard: if the feed never opens, force a fresh attempt
      state.connectTimer = setTimeout(() => {
        state.connectTimer = null;
        if (!state.connected && !state.tornDown) {
          try { ws.close(); } catch(e){}
        }
      }, FEED_TIMEOUT_MS);
    }

    function scheduleReconnect(source) {
      const state = feedSockets[source];
      if (!state) return;
      if (document.hidden) return; // no background reconnect; resume on foreground
      if (state.reconnectTimer) return;
      state.reconnectTimer = setTimeout(() => {
        state.reconnectTimer = null;
        connectFeed(source);
      }, 3000);
    }

    function resumeFeeds() {
      const now = Date.now();
      let needsBackfill = candleTicks.length === 0;
      FEED_SOURCES.forEach(source => {
        const state = feedSockets[source];
        if (!state || !state.ws || state.ws.readyState !== WebSocket.OPEN || !state.connected) {
          connectFeed(source);
        } else if (now - state.lastTradeTs > FEED_STALE_MS) {
          // zombie feed: force a fresh connection
          try { state.ws.close(); } catch(e){}
        }
      });
      if (needsBackfill) {
        fetchHistoricalCandles();
      }
    }

    function computeVWM() {
      if (liveTradeBuffer.length === 0) return;
      const sorted = [...liveTradeBuffer].sort((a, b) => a.price - b.price);
      const totalVol = sorted.reduce((sum, t) => sum + t.volume, 0);
      if (totalVol === 0) return;

      let cumulative = 0;
      for (let trade of sorted) {
        cumulative += trade.volume;
        if (cumulative >= totalVol / 2) {
          liveSpotPrice = trade.price;
          return;
        }
      }
      liveSpotPrice = sorted[Math.floor(sorted.length / 2)].price;
    }

    // --- Resume Feeds on Foreground (visibility change, pageshow, time jump) ---
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        resumeFeeds();
      }
    });

    window.addEventListener('pageshow', () => {
      resumeFeeds();
    });

    // --- Engine Loop ---
    function tickEngine() {
      const now = new Date();
      const mins = now.getMinutes();
      const secs = now.getSeconds();

      const windowStartMin = Math.floor(mins / 15) * 15;
      const elapsedSecs = (mins - windowStartMin) * 60 + secs;
      const totalWindowSecs = 900;
      const remainingSecs = Math.max(0, totalWindowSecs - elapsedSecs);

      // Per-feed health: cycle any feed that has gone quiet (zombie) or stalled mid-connect
      const nowMs = Date.now();
      FEED_SOURCES.forEach(source => {
        const state = feedSockets[source];
        if (state && state.ws && state.connected && (nowMs - state.lastTradeTs > FEED_STALE_MS)) {
          try { state.ws.close(); } catch(e){} // zombie feed: force reconnect
        }
      });

      // Large time jump (device slept / tab suspended): rebuild tick history + feeds
      if (nowMs - lastTickTs > 60000) {
        candleTicks = [];
        pendingReconnect = true;
      }
      lastTickTs = nowMs;
      if (pendingReconnect) {
        pendingReconnect = false;
        resumeFeeds();
        fetchHistoricalCandles();
      }

      const isStale = (Date.now() - lastTradeTimestamp > 4000) && lastTradeTimestamp > 0;
      const banner = document.getElementById('alertBanner');

      if (isStale) {
        banner.className = 'status-stale';
        banner.innerText = `FEED FROZEN - RECONNECTING...`;
        return;
      }

      if (elapsedSecs < lastElapsedSecs) {
        candleTicks = [];
      }
      lastElapsedSecs = elapsedSecs;

      if (liveSpotPrice > 0) {
        candleTicks.push(liveSpotPrice);
      }

      const t = candleTicks.length;
      if (liveSpotPrice === 0) return;

      const currentSum = candleTicks.reduce((a, b) => a + b, 0);
      const target = parseFloat(document.getElementById('targetPrice').value) || 0;
      const dir = document.getElementById('positionDir').value;

      const missingSecs = Math.max(0, elapsedSecs - t);
      const effectiveSum = currentSum + (missingSecs * liveSpotPrice);
      const effectiveTime = Math.max(1, elapsedSecs);
      const currentTWAP = effectiveSum / effectiveTime;

      let pReq = 0;
      if (remainingSecs > 0) {
        pReq = ((totalWindowSecs * target) - effectiveSum) / remainingSecs;
      } else {
        pReq = target;
      }

      let cushionGap = 0;
      let isViolating = false;
      let isWarning = false;

      if (dir === 'UNDER') {
        cushionGap = pReq - liveSpotPrice;
        if (liveSpotPrice > pReq) isViolating = true;
        if (cushionGap < 15) isWarning = true;
      } else {
        cushionGap = liveSpotPrice - pReq;
        if (liveSpotPrice < pReq) isViolating = true;
        if (cushionGap < 15) isWarning = true;
      }

      // DOM Updates
      document.getElementById('liveSpot').innerText = `$${liveSpotPrice.toFixed(2)}`;
      
      const divGap = coinbasePrice > 0 ? (coinbasePrice - liveSpotPrice) : 0;
      const divEl = document.getElementById('cbDivergence');
      divEl.innerText = `${divGap >= 0 ? '+' : ''}$${divGap.toFixed(2)}`;

      document.getElementById('currentTwap').innerText = `$${currentTWAP.toFixed(2)}`;
      document.getElementById('pReqDisplay').innerText = `$${pReq.toFixed(2)}`;
      
      const gapEl = document.getElementById('cushionGap');
      gapEl.innerText = `$${cushionGap.toFixed(2)}`;
      gapEl.style.color = cushionGap >= 0 ? '#3fb950' : '#f85149';

      document.getElementById('elapsedSecs').innerText = elapsedSecs;
      document.getElementById('remainingSecs').innerText = remainingSecs;
      
      const progressPct = (elapsedSecs / totalWindowSecs) * 100;
      document.getElementById('progressFill').style.width = `${progressPct}%`;

      const mRemaining = Math.floor(remainingSecs / 60);
      const sRemaining = remainingSecs % 60;
      const timeStr = `${String(mRemaining).padStart(2, '0')}:${String(sRemaining).padStart(2, '0')}`;
      document.getElementById('timerDisplay').innerText = timeStr;

      if (isViolating) {
        banner.className = 'status-exit';
        banner.innerText = `HARD EXIT: INVALIDATION IMMINENT (SPOT PASSED P_REQ)`;
        playSound('EXIT');
      } else if (isWarning) {
        banner.className = 'status-warn';
        banner.innerText = `WARNING: LATE TWAP DRIFT ACCELERATING (CUSHION: $${cushionGap.toFixed(2)})`;
        playSound('WARN');
      } else {
        banner.className = 'status-safe';
        banner.innerText = `SAFE: CUSHION HOLDING (GAP: $${cushionGap.toFixed(2)})`;
      }
    }

    window.onload = async () => {
      await fetchHistoricalCandles();
      initWebSockets();
      setInterval(tickEngine, 1000);
    };
  </script>
</body>
</html>
